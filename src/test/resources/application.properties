# Configuracion para Pruebas Unitarias e Integracion (JUnit 5 + JaCoCo)
spring.application.name=inventario-sucursales-test

# Base de datos en memoria para pruebas aisladas y reproducibles en CI/CD
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# No ejecutar scripts DDL externos en H2 durante las pruebas (Hibernate crea el schema en memoria)
spring.sql.init.mode=never

# Clave Secreta JWT para tests
jwt.secret=ClaveSecretaSuperSeguraParaFirmarTokensJWTInventarioSucursalesMexico2026DebeTenerMasDe256Bits
jwt.expiration-ms=3600000
